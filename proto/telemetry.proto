syntax = "proto3";

package rov.telemetry;

// A standard 3-axis representation for IMU data
message Vector3D {
  float x = 1;
  float y = 2;
  float z = 3;
}

// Unit quaternion (w + xi + yj + zk)
message Quaternion {
  float w = 1;
  float x = 2;
  float y = 3;
  float z = 4;
}

// Telemetry from the ROV sensors to the topside
message SensorData {
  uint64 timestamp_us = 1;
  Vector3D acceleration = 2;      // m/s^2
  Vector3D angular_velocity = 3;   // rad/s
  float depth = 4;                 // meters (calculated from pressure)
  float temperature = 5;           // Celsius
  Quaternion orientation = 6;      // vehicle pose, local -> world (absent = assume level)
}

// testing message
message test {
  string msg = 1;
}

// for tuning
message ControllerTuning {
  bool enable_tuning = 1;
  float k_p = 2;
  float k_i = 3;
  float k_d = 4;
}

// Control commands from topside (joystick) to the ROV
message ControllerCommand {
  float x = 1;
  float y = 2;
  float z = 3;
  float roll = 4;
  float pitch = 5;
  float yaw = 6;
  bool enable_depth_control = 7;  // master switch for depth hold
  float target_depth = 8;         // unused by the hold logic (target is latched onboard)
  bool depth_override = 9;        // true while the pilot holds the "free depth" button
}

// Final output of the control node: a rigid transform (position + rotation)
// sent to the thruster mapping
message ThrusterCommand {
  uint64 timestamp_us = 1;
  Vector3D translation = 2;  // local frame, vertical already replaced by depth hold when active
  Quaternion rotation = 3;
}
